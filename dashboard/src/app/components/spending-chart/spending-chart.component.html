<div class="chart-container">
	<svg viewBox="0 0 100 100">
		@for (slice of slices(); track slice.name) {
			<path
				[attr.d]="slice.path"
				[attr.fill]="slice.color"
				class="chart-slice"
			>
				<title>{{ slice.name }}: {{ slice.value | currency }}</title>
			</path>
		}
		<circle
			cx="50"
			cy="50"
			r="30"
			fill="var(--item-bg)"
		/>
		<text
			x="50"
			y="55"
			text-anchor="middle"
			class="chart-label"
		>
			Spending
		</text>
	</svg>

	<div class="legend">
		@for (slice of slices(); track slice.name) {
			<div class="legend-item">
				<span
					class="dot"
					[style.background]="slice.color"
				></span>
				<span class="name">{{ slice.name }}</span>
				<span class="value">{{ slice.percent }}%</span>
			</div>
		}
	</div>
</div>
