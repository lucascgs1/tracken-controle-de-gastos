<ng-container *transloco="let t">
	<lib-tracken-page-header
		[title]="t('settings.account')"
		[subtitle]="t('settings.securityDesc')"
		libTrackenAnimate="fade-in"
	>
		<div actions>
			<lib-tracken-button
				variant="ghost"
				size="sm"
				routerLink="/settings"
			>
				{{ t('common.back') || 'Back' }}
			</lib-tracken-button>
			<lib-tracken-button
				variant="primary"
				size="sm"
				(btnClick)="onSave()"
				[loading]="loading()"
				[disabled]="form.invalid || loading()"
			>
				{{ t('common.save') }}
			</lib-tracken-button>
		</div>
	</lib-tracken-page-header>

	<div
		class="security-grid"
		libTrackenAnimate="slide-up"
		[delay]="200"
	>
		<lib-tracken-card
			[title]="t('settings.changePassword')"
			[formGroup]="form"
		>
			<div class="settings-form-grid">
				<lib-tracken-input
					[label]="t('settings.currentPassword')"
					formControlName="currentPassword"
					type="password"
					placeholder="••••••••"
				></lib-tracken-input>

				<lib-tracken-input
					[label]="t('settings.newPassword')"
					formControlName="newPassword"
					type="password"
					placeholder="Min. 6 characters"
				></lib-tracken-input>

				<lib-tracken-input
					[label]="t('settings.confirmPassword')"
					formControlName="confirmPassword"
					type="password"
					placeholder="Repeat new password"
				></lib-tracken-input>
			</div>
		</lib-tracken-card>

		<lib-tracken-card
			[title]="t('settings.twoFactor')"
			libTrackenAnimate="slide-up"
			[delay]="400"
		>
			<div class="two-factor-content">
				<div class="info">
					<span class="material-icons">security</span>
					<p>
						{{
							t('settings.twoFactorDesc') || 'Adicione uma camada extra de segurança à sua conta.'
						}}
					</p>
				</div>
				<lib-tracken-button
					variant="outline"
					size="sm"
				>
					{{ t('settings.enable') || 'Enable' }}
				</lib-tracken-button>
			</div>
		</lib-tracken-card>
	</div>
</ng-container>
