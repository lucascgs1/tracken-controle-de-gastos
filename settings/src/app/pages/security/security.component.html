<ng-container *transloco="let t">
	<lib-tracken-page-header
		[title]="t('settings.account')"
		[subtitle]="t('settings.securityDesc')"
	>
		<div actions>
			<lib-tracken-button
				variant="ghost"
				size="sm"
				routerLink="/settings"
			>
				{{ t('common.back') || 'Back' }}
			</lib-tracken-button>
			<lib-tracken-button
				variant="primary"
				size="sm"
				(btnClick)="onSave()"
				[loading]="loading()"
				[disabled]="form.invalid || loading()"
			>
				{{ t('common.save') }}
			</lib-tracken-button>
		</div>
	</lib-tracken-page-header>

	<lib-tracken-card
		[title]="t('settings.security')"
		[formGroup]="form"
	>
		<div class="settings-form-grid">
			<lib-tracken-input
				[label]="t('settings.currentPassword')"
				formControlName="currentPassword"
				type="password"
				placeholder="••••••••"
			></lib-tracken-input>

			<lib-tracken-input
				[label]="t('settings.newPassword')"
				formControlName="newPassword"
				type="password"
				placeholder="••••••••"
				[error]="
					form.controls.newPassword.touched && form.controls.newPassword.errors?.['minlength']
						? 'Min 6 chars'
						: null
				"
			></lib-tracken-input>

			<lib-tracken-input
				[label]="t('settings.confirmPassword')"
				formControlName="confirmPassword"
				type="password"
				placeholder="••••••••"
				[error]="
					form.controls.confirmPassword.touched && form.errors?.['passwordMismatch']
						? 'Passwords do not match'
						: null
				"
			></lib-tracken-input>
		</div>
	</lib-tracken-card>
</ng-container>
