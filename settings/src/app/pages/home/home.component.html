<div
	class="settings-home-container"
	*transloco="let t"
>
	<lib-tracken-page-header
		[title]="t('settings.title')"
		[subtitle]="t('settings.subtitle')"
		libTrackenAnimate="fade-in"
	></lib-tracken-page-header>

	<div
		class="menu-grid"
		libTrackenAnimate="slide-up"
		[delay]="200"
	>
		@for (item of menuItems; track item.id; let i = $index) {
			<a
				[routerLink]="item.route"
				class="menu-card"
				libTrackenAnimate="fade-in"
				[delay]="300 + i * 100"
			>
				<div class="icon-wrapper">
					<span class="material-icons">{{ item.icon }}</span>
				</div>
				<div class="content">
					<h3>{{ t(item.titleKey) }}</h3>
					<p>{{ t(item.descriptionKey) || 'Gerencie suas preferências desta categoria' }}</p>
				</div>
				<div class="arrow">→</div>
			</a>
		}
	</div>
</div>
