<ng-container *transloco="let t">
	<lib-tracken-page-header
		[title]="t('settings.profile')"
		[subtitle]="t('settings.profileDesc')"
	>
		<div actions>
			<lib-tracken-button
				variant="ghost"
				size="sm"
				routerLink="/settings"
			>
				{{ t('common.back') || 'Back' }}
			</lib-tracken-button>
			<lib-tracken-button
				variant="primary"
				size="sm"
				(btnClick)="onSave()"
				[loading]="loading()"
				[disabled]="form.invalid || loading()"
			>
				{{ t('common.save') }}
			</lib-tracken-button>
		</div>
	</lib-tracken-page-header>

	<lib-tracken-card
		[title]="t('settings.profile')"
		[formGroup]="form"
	>
		<div class="settings-form-grid">
			<lib-tracken-input
				[label]="t('settings.firstName')"
				formControlName="firstName"
				placeholder="e.g. John"
			></lib-tracken-input>

			<lib-tracken-input
				[label]="t('settings.lastName')"
				formControlName="lastName"
				placeholder="e.g. Doe"
			></lib-tracken-input>

			<lib-tracken-input
				[label]="t('settings.email')"
				formControlName="email"
				type="email"
				[disabled]="true"
			></lib-tracken-input>
		</div>
	</lib-tracken-card>
</ng-container>
