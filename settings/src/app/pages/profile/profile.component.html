<ng-container *transloco="let t">
	<lib-tracken-page-header
		[title]="t('settings.profile')"
		[subtitle]="t('settings.profileDesc') || 'Gerencie suas informações básicas'"
	>
		<div actions>
			<lib-tracken-button
				variant="ghost"
				size="sm"
				routerLink="/settings"
			>
				Voltar
			</lib-tracken-button>
			<lib-tracken-button
				variant="primary"
				size="sm"
				(btnClick)="onSave()"
				[loading]="loading()"
				[disabled]="form.invalid || loading()"
			>
				{{ t('common.save') }}
			</lib-tracken-button>
		</div>
	</lib-tracken-page-header>

	<lib-tracken-card
		[title]="t('settings.profileInfo') || 'Informações Pessoais'"
		[formGroup]="form"
	>
		<div class="form-grid">
			<lib-tracken-input
				[label]="t('settings.firstName')"
				formControlName="firstName"
			></lib-tracken-input>
			<lib-tracken-input
				[label]="t('settings.lastName')"
				formControlName="lastName"
			></lib-tracken-input>
		</div>
		<lib-tracken-input
			[label]="t('login.email')"
			formControlName="email"
			type="email"
		></lib-tracken-input>
	</lib-tracken-card>
</ng-container>
