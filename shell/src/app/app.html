<div
	class="shell-container"
	*transloco="let t"
>
	<header>
		<h1>Tracken</h1>
		<nav>
			<div class="lang-selector">
				<button
					[class.active]="langService.getActiveLang() === 'en'"
					(click)="setLanguage('en')"
				>
					EN
				</button>
				<button
					[class.active]="langService.getActiveLang() === 'pt'"
					(click)="setLanguage('pt')"
				>
					PT
				</button>
			</div>

			<lib-tracken-button
				(btnClick)="toggleTheme()"
				variant="secondary"
				size="sm"
			>
				<span class="material-icons">{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</span>
				{{ t('common.theme') }}
			</lib-tracken-button>

			@if (user(); as user) {
			<lib-tracken-button
				variant="ghost"
				size="sm"
				routerLink="/dashboard"
			>
				{{ t('common.dashboard') }}
			</lib-tracken-button>

			<lib-tracken-dropdown>
				<div
					trigger
					class="user-trigger"
				>
					<div class="avatar">{{ user.email | initials }}</div>
					<span class="material-icons">expand_more</span>
				</div>
				<div menu>
					<a routerLink="/settings">
						<span class="material-icons">settings</span>
						{{ t('common.settings') }}
					</a>
					<button (click)="onLogout()">
						<span class="material-icons">logout</span>
						{{ t('common.logout') }}
					</button>
				</div>
			</lib-tracken-dropdown>
			}
		</nav>
	</header>

	<main>
		<router-outlet></router-outlet>
	</main>
</div>

<lib-tracken-toast-container></lib-tracken-toast-container>
