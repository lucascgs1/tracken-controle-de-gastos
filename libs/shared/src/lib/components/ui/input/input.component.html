<div
	class="input-container"
	[class.has-error]="error()"
>
	@if (label()) {
		<label [for]="inputId()">{{ label() }}</label>
	}
	<div class="input-wrapper">
		<input
			[id]="inputId()"
			[type]="type()"
			[placeholder]="placeholder()"
			[value]="value()"
			(input)="onInput($event)"
			(blur)="onBlur()"
			[disabled]="disabled()"
			class="tracken-input"
		/>
		<ng-content select="[suffix]"></ng-content>
	</div>
	@if (error()) {
		<span class="error-msg">{{ error() }}</span>
	}
</div>
