<button
	[class]="classes"
	(click)="onClick()"
	[disabled]="disabled()"
	[type]="type()"
>
	@if (loading()) {
		<span class="spinner"></span>
	} @else {
		@if (icon() && iconPosition() === 'left') {
			<span class="material-icons button-icon">{{ icon() }}</span>
		}

		<span class="button-content">
			<ng-content></ng-content>
		</span>

		@if (icon() && iconPosition() === 'right') {
			<span class="material-icons button-icon">{{ icon() }}</span>
		}
	}
</button>
