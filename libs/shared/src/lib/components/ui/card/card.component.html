<div
	class="premium-card"
	[class.glass]="glass()"
	[class]="'padding-' + padding()"
>
	@if (title() || subtitle()) {
		<div class="card-header">
			<div class="header-text">
				@if (title()) {
					<h3>{{ title() }}</h3>
				}
				@if (subtitle()) {
					<p class="subtitle">{{ subtitle() }}</p>
				}
			</div>
			<ng-content select="[header-actions]"></ng-content>
		</div>
	}
	<div class="card-content">
		<ng-content></ng-content>
	</div>
</div>
